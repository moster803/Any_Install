name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # "Run workflow" on GitHub with a version like v0.1.0 builds the files
  # and publishes them as a release with that version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One build job at a time, so two runs can never publish the same
    # version: the second one sees the first one's tag and stops.
    concurrency:
      group: build-and-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Which version to publish, if any:
      #   - a pushed tag v1.2.3
      #   - "Run workflow" with a version
      #   - a push to main whose VERSION file names a version that has no
      #     release yet (so a release is: change VERSION, merge to main)
      - name: Decide release
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=""
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$REF" == refs/tags/v* ]]; then
            version="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && -f VERSION ]]; then
            version="$(<VERSION)"
            version="${version#"${version%%[![:space:]]*}"}"   # trim leading whitespace
            version="${version%"${version##*[![:space:]]}"}"   # trim trailing whitespace
          fi
          if [[ -n "$version" ]]; then
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.3, got: $version"; exit 1; }
            # A version is published once, so its files always match its tag.
            if [[ -n "$INPUT_VERSION" || "$REF" != refs/tags/* ]]; then
              rc=0
              git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null || rc=$?
              if [[ $rc -eq 0 ]]; then
                if [[ -n "$INPUT_VERSION" ]]; then
                  echo "::error::$version already exists, choose a new version"
                  exit 1
                fi
                echo "$version is already released, nothing to publish"
                version=""
              elif [[ $rc -ne 2 ]]; then
                echo "::error::Could not check whether $version exists (git ls-remote exit $rc)"
                exit 1
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: scripts/build.sh "${VERSION:-$(git describe --tags --always)}"
      - uses: actions/upload-artifact@v4
        with:
          name: AnyInstall
          path: dist/*
      # The release stays a draft until both files are uploaded, so nobody
      # sees a release with missing downloads.
      - name: Release
        if: steps.rel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
      - name: Publish release
        if: steps.rel.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.version }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
