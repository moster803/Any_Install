name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # "Run workflow" on GitHub with a version like v0.1.0 builds the files
  # and publishes them as a release with that version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like v1.2.3"; exit 1; }
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build.sh "${VERSION:-$(git describe --tags --always)}"
      - uses: actions/upload-artifact@v4
        with:
          name: AnyInstall
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: dist/*
          generate_release_notes: true
